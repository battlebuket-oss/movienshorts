services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: runner
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:?Set NEXT_PUBLIC_API_URL}
        NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:?Set NEXT_PUBLIC_APP_URL}
        NEXT_PUBLIC_SELF_HOST: "true"
        NEXT_PUBLIC_PRO_PRICE_MONTHLY: ${NEXT_PUBLIC_PRO_PRICE_MONTHLY:-10}
        NEXT_PUBLIC_SCALE_PRICE_MONTHLY: ${NEXT_PUBLIC_SCALE_PRICE_MONTHLY:-50}
        NEXT_PUBLIC_FREE_PLAN_TASK_LIMIT: ${NEXT_PUBLIC_FREE_PLAN_TASK_LIMIT:-10}
        NEXT_PUBLIC_PRO_PLAN_TASK_LIMIT: ${NEXT_PUBLIC_PRO_PLAN_TASK_LIMIT:-50}
        NEXT_PUBLIC_SCALE_PLAN_TASK_LIMIT: ${NEXT_PUBLIC_SCALE_PLAN_TASK_LIMIT:-300}
    environment:
      NODE_ENV: production
      NEXT_TELEMETRY_DISABLED: "1"
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:?Set NEXT_PUBLIC_API_URL}
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:?Set NEXT_PUBLIC_APP_URL}
      NEXT_PUBLIC_SELF_HOST: "true"
      BACKEND_INTERNAL_URL: http://backend:8000
      DATABASE_URL: postgresql://${POSTGRES_USER:-supoclip}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-supoclip}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?Set BETTER_AUTH_SECRET}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:?Set BETTER_AUTH_URL}
      BACKEND_AUTH_SECRET: ${BACKEND_AUTH_SECRET:?Set BACKEND_AUTH_SECRET}
      APP_SETTINGS_ENCRYPTION_KEY: ${APP_SETTINGS_ENCRYPTION_KEY:?Set APP_SETTINGS_ENCRYPTION_KEY}
      DISABLE_SIGN_UP: ${DISABLE_SIGN_UP:-false}
      NEXT_PUBLIC_LANDING_ONLY_MODE: ${NEXT_PUBLIC_LANDING_ONLY_MODE:-false}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      STRIPE_PRICE_ID: ${STRIPE_PRICE_ID:-}
      STRIPE_PRO_PRICE_ID: ${STRIPE_PRO_PRICE_ID:-}
      STRIPE_SCALE_PRICE_ID: ${STRIPE_SCALE_PRICE_ID:-}
      STRIPE_CHECKOUT_URL: ${STRIPE_CHECKOUT_URL:-}
      STRIPE_CUSTOMER_PORTAL_URL: ${STRIPE_CUSTOMER_PORTAL_URL:-}
      REVENUECAT_WEBHOOK_AUTH_HEADER: ${REVENUECAT_WEBHOOK_AUTH_HEADER:-}
      REVENUECAT_PRO_PRODUCT_IDS: ${REVENUECAT_PRO_PRODUCT_IDS:-}
      REVENUECAT_SCALE_PRODUCT_IDS: ${REVENUECAT_SCALE_PRODUCT_IDS:-}
      AWS_REGION: ${AWS_REGION:-}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      SES_FROM_EMAIL: ${SES_FROM_EMAIL:-}
    ports:
      - "127.0.0.1:3107:3107"
    depends_on:
      postgres:
        condition: service_healthy
      backend:
        condition: service_healthy
    restart: unless-stopped
    init: true
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:size=64m,noexec,nosuid
      - /app/.next/cache:size=512m,uid=1001,gid=1001
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:3107/"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: [".venv/bin/uvicorn", "src.main_refactored:app", "--host", "0.0.0.0", "--port", "8000", "--workers", "2"]
    environment:
      PYTHONPATH: /app
      PYTHONUNBUFFERED: "1"
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-supoclip}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-supoclip}
      TEMP_DIR: /app/uploads
      OUTPUT_DIR: /app/clips
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD}
      ASSEMBLY_AI_API_KEY: ${ASSEMBLY_AI_API_KEY:?Set ASSEMBLY_AI_API_KEY}
      ASSEMBLY_AI_HTTP_TIMEOUT_SECONDS: ${ASSEMBLY_AI_HTTP_TIMEOUT_SECONDS:-900}
      LLM: ${LLM:?Set LLM}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-}
      OLLAMA_API_KEY: ${OLLAMA_API_KEY:-}
      YOUTUBE_DATA_API_KEY: ${YOUTUBE_DATA_API_KEY:-}
      YOUTUBE_METADATA_PROVIDER: ${YOUTUBE_METADATA_PROVIDER:-yt_dlp}
      YOUTUBE_DOWNLOAD_PROVIDER: ${YOUTUBE_DOWNLOAD_PROVIDER:-yt_dlp}
      APIFY_API_TOKEN: ${APIFY_API_TOKEN:-}
      APIFY_YOUTUBE_DOWNLOADER_ACTOR: ${APIFY_YOUTUBE_DOWNLOADER_ACTOR:-epctex/youtube-video-downloader}
      APIFY_YOUTUBE_DEFAULT_QUALITY: ${APIFY_YOUTUBE_DEFAULT_QUALITY:-1080}
      APIFY_RUN_TIMEOUT_SECONDS: ${APIFY_RUN_TIMEOUT_SECONDS:-900}
      PEXELS_API_KEY: ${PEXELS_API_KEY:-}
      WHISPER_MODEL_SIZE: ${WHISPER_MODEL_SIZE:-medium}
      QUEUED_TASK_TIMEOUT_SECONDS: ${QUEUED_TASK_TIMEOUT_SECONDS:-180}
      DEFAULT_PROCESSING_MODE: ${DEFAULT_PROCESSING_MODE:-fast}
      FAST_MODE_MAX_CLIPS: ${FAST_MODE_MAX_CLIPS:-4}
      FAST_MODE_TRANSCRIPT_MODEL: ${FAST_MODE_TRANSCRIPT_MODEL:-universal}
      SELF_HOST: "true"
      BACKEND_AUTH_SECRET: ${BACKEND_AUTH_SECRET:?Set BACKEND_AUTH_SECRET}
      APP_SETTINGS_ENCRYPTION_KEY: ${APP_SETTINGS_ENCRYPTION_KEY:?Set APP_SETTINGS_ENCRYPTION_KEY}
      ALLOW_UNSIGNED_BACKEND_AUTH: "false"
      AUTH_SIGNATURE_TTL_SECONDS: ${AUTH_SIGNATURE_TTL_SECONDS:-300}
      CORS_ORIGINS: ${CORS_ORIGINS:?Set CORS_ORIGINS}
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:?Set NEXT_PUBLIC_APP_URL}
      AWS_REGION: ${AWS_REGION:-}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      SES_FROM_EMAIL: ${SES_FROM_EMAIL:-}
      DISCORD_FEEDBACK_WEBHOOK_URL: ${DISCORD_FEEDBACK_WEBHOOK_URL:-}
      DISCORD_SALES_WEBHOOK_URL: ${DISCORD_SALES_WEBHOOK_URL:-}
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - uploads:/app/uploads
      - clips:/app/clips
      - user_fonts:/app/fonts/user
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    init: true
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: [".venv/bin/arq", "src.workers.tasks.WorkerSettings"]
    environment:
      PYTHONPATH: /app
      PYTHONUNBUFFERED: "1"
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-supoclip}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-supoclip}
      TEMP_DIR: /app/uploads
      OUTPUT_DIR: /app/clips
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD}
      ASSEMBLY_AI_API_KEY: ${ASSEMBLY_AI_API_KEY:?Set ASSEMBLY_AI_API_KEY}
      ASSEMBLY_AI_HTTP_TIMEOUT_SECONDS: ${ASSEMBLY_AI_HTTP_TIMEOUT_SECONDS:-900}
      LLM: ${LLM:?Set LLM}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-}
      OLLAMA_API_KEY: ${OLLAMA_API_KEY:-}
      YOUTUBE_DATA_API_KEY: ${YOUTUBE_DATA_API_KEY:-}
      YOUTUBE_METADATA_PROVIDER: ${YOUTUBE_METADATA_PROVIDER:-yt_dlp}
      YOUTUBE_DOWNLOAD_PROVIDER: ${YOUTUBE_DOWNLOAD_PROVIDER:-yt_dlp}
      APIFY_API_TOKEN: ${APIFY_API_TOKEN:-}
      APIFY_YOUTUBE_DOWNLOADER_ACTOR: ${APIFY_YOUTUBE_DOWNLOADER_ACTOR:-epctex/youtube-video-downloader}
      APIFY_YOUTUBE_DEFAULT_QUALITY: ${APIFY_YOUTUBE_DEFAULT_QUALITY:-1080}
      APIFY_RUN_TIMEOUT_SECONDS: ${APIFY_RUN_TIMEOUT_SECONDS:-900}
      PEXELS_API_KEY: ${PEXELS_API_KEY:-}
      WHISPER_MODEL_SIZE: ${WHISPER_MODEL_SIZE:-medium}
      QUEUED_TASK_TIMEOUT_SECONDS: ${QUEUED_TASK_TIMEOUT_SECONDS:-180}
      DEFAULT_PROCESSING_MODE: ${DEFAULT_PROCESSING_MODE:-fast}
      FAST_MODE_MAX_CLIPS: ${FAST_MODE_MAX_CLIPS:-4}
      FAST_MODE_TRANSCRIPT_MODEL: ${FAST_MODE_TRANSCRIPT_MODEL:-universal}
      SELF_HOST: "true"
      BACKEND_AUTH_SECRET: ${BACKEND_AUTH_SECRET:?Set BACKEND_AUTH_SECRET}
      APP_SETTINGS_ENCRYPTION_KEY: ${APP_SETTINGS_ENCRYPTION_KEY:?Set APP_SETTINGS_ENCRYPTION_KEY}
      ALLOW_UNSIGNED_BACKEND_AUTH: "false"
      AUTH_SIGNATURE_TTL_SECONDS: ${AUTH_SIGNATURE_TTL_SECONDS:-300}
      CORS_ORIGINS: ${CORS_ORIGINS:?Set CORS_ORIGINS}
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:?Set NEXT_PUBLIC_APP_URL}
    volumes:
      - uploads:/app/uploads
      - clips:/app/clips
      - user_fonts:/app/fonts/user
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      backend:
        condition: service_healthy
    restart: unless-stopped
    init: true
    security_opt:
      - no-new-privileges:true

  redis:
    image: redis:7-alpine
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD}
    command: ["sh", "-c", "exec redis-server --appendonly yes --requirepass \"$$REDIS_PASSWORD\""]
    volumes:
      - redis_data:/data
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 15s
      timeout: 5s
      retries: 5

  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-supoclip}
      POSTGRES_USER: ${POSTGRES_USER:-supoclip}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/001-init.sql:ro
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
  redis_data:
  uploads:
  clips:
  user_fonts:
