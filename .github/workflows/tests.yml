name: Tests

on:
  pull_request:
  push:
    branches:
      - main
      - master

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: supoclip
          POSTGRES_USER: supoclip
          POSTGRES_PASSWORD: supoclip_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U supoclip -d supoclip"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql+asyncpg://supoclip:supoclip_password@127.0.0.1:5432/supoclip
      TEST_DATABASE_URL: postgresql+asyncpg://supoclip:supoclip_password@127.0.0.1:5432/supoclip
      REDIS_HOST: 127.0.0.1
      REDIS_PORT: 6379
      SELF_HOST: "true"
      BACKEND_AUTH_SECRET: supoclip_test_secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@v4
      - name: Install backend dependencies
        run: cd backend && uv sync --all-groups
      - name: Run backend tests
        run: cd backend && .venv/bin/pytest

  frontend:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SELF_HOST: "true"
      BACKEND_AUTH_SECRET: supoclip_test_secret
      BETTER_AUTH_SECRET: supoclip_better_auth_test_secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Enable pinned pnpm
        run: corepack enable && corepack prepare pnpm@10.27.0 --activate
      - name: Install frontend dependencies
        run: cd frontend && pnpm install --frozen-lockfile
      - name: Run frontend unit tests
        run: cd frontend && pnpm run test:coverage

  frontend-build:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://supoclip:supoclip_password@127.0.0.1:5432/supoclip
      NEXT_PUBLIC_API_URL: http://127.0.0.1:8000
      NEXT_PUBLIC_APP_URL: http://localhost:3107
      NEXT_PUBLIC_SELF_HOST: "true"
      NEXT_PUBLIC_LANDING_ONLY_MODE: "true"
      BETTER_AUTH_SECRET: movie-shorts-ci-better-auth-secret
      BETTER_AUTH_URL: http://localhost:3107
      BACKEND_AUTH_SECRET: movie-shorts-ci-backend-auth-secret
      APP_SETTINGS_ENCRYPTION_KEY: movie-shorts-ci-settings-encryption-key
      SELF_HOST: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Enable pinned pnpm
        run: corepack enable && corepack prepare pnpm@10.27.0 --activate
      - name: Install frontend dependencies
        run: cd frontend && pnpm install --frozen-lockfile
      - name: Build production frontend
        run: cd frontend && pnpm run build

  production-compose:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_API_URL: https://api.example.invalid
      NEXT_PUBLIC_APP_URL: https://movie-shorts.example.invalid
      BETTER_AUTH_URL: https://movie-shorts.example.invalid
      BETTER_AUTH_SECRET: ci-only-better-auth-secret
      BACKEND_AUTH_SECRET: ci-only-backend-auth-secret
      APP_SETTINGS_ENCRYPTION_KEY: ci-only-encryption-key
      POSTGRES_PASSWORD: ci-only-postgres-password
      REDIS_PASSWORD: ci-only-redis-password
      ASSEMBLY_AI_API_KEY: ci-only-assemblyai-key
      LLM: google-gla:gemini-3-flash-preview
      GOOGLE_API_KEY: ci-only-google-key
      CORS_ORIGINS: https://movie-shorts.example.invalid
    steps:
      - uses: actions/checkout@v4
      - name: Validate production Compose configuration
        run: docker compose --env-file /dev/null -f docker-compose.production.yml config --quiet

  e2e:
    runs-on: ubuntu-latest
    needs:
      - backend
      - frontend
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: supoclip
          POSTGRES_USER: supoclip
          POSTGRES_PASSWORD: supoclip_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U supoclip -d supoclip"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://supoclip:supoclip_password@127.0.0.1:5432/supoclip
      TEST_DATABASE_URL: postgresql+asyncpg://supoclip:supoclip_password@127.0.0.1:5432/supoclip
      REDIS_HOST: 127.0.0.1
      REDIS_PORT: 6379
      NEXT_PUBLIC_SELF_HOST: "true"
      BACKEND_AUTH_SECRET: supoclip_test_secret
      BETTER_AUTH_SECRET: supoclip_better_auth_test_secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Install backend dependencies
        run: cd backend && uv sync --all-groups
      - name: Enable pinned pnpm
        run: corepack enable && corepack prepare pnpm@10.27.0 --activate
      - name: Install frontend dependencies
        run: cd frontend && pnpm install --frozen-lockfile
      - name: Install Playwright browsers
        run: cd frontend && pnpm exec playwright install --with-deps
      - name: Run Playwright smoke tests
        run: cd frontend && pnpm run test:e2e
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            frontend/playwright-report
            frontend/test-results
